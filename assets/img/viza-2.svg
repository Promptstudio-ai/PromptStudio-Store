<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 640" role="img" aria-labelledby="t d">
<title id="t">Viza — statistiques de voyage</title>
<desc id="d">Écran de statistiques montrant la progression par continent : Europe, Asie, Amérique, Afrique.</desc>
<rect width="320" height="640" rx="34" fill="#fdfcf9"/>
<rect x="0" y="0" width="320" height="72" fill="#8fb2ea"/>
<text x="24" y="44" font-family="'Space Grotesk', Arial, sans-serif" font-weight="700" font-size="20" fill="#14151a">Statistiques</text>

<text x="24" y="110" font-family="Poppins, Arial, sans-serif" font-weight="600" font-size="13" fill="#14151a">Europe</text>
<text x="296" y="110" text-anchor="end" font-family="'Space Grotesk', Arial, sans-serif" font-weight="700" font-size="13" fill="#14151a">82%</text>
<rect x="24" y="120" width="272" height="16" rx="8" fill="#eef3fc" stroke="#14151a" stroke-width="2"/>
<rect x="24" y="120" width="223" height="16" rx="8" fill="#5be7db"/>

<text x="24" y="176" font-family="Poppins, Arial, sans-serif" font-weight="600" font-size="13" fill="#14151a">Asie</text>
<text x="296" y="176" text-anchor="end" font-family="'Space Grotesk', Arial, sans-serif" font-weight="700" font-size="13" fill="#14151a">34%</text>
<rect x="24" y="186" width="272" height="16" rx="8" fill="#eef3fc" stroke="#14151a" stroke-width="2"/>
<rect x="24" y="186" width="92" height="16" rx="8" fill="#a488f2"/>

<text x="24" y="242" font-family="Poppins, Arial, sans-serif" font-weight="600" font-size="13" fill="#14151a">Am&#233;rique</text>
<text x="296" y="242" text-anchor="end" font-family="'Space Grotesk', Arial, sans-serif" font-weight="700" font-size="13" fill="#14151a">21%</text>
<rect x="24" y="252" width="272" height="16" rx="8" fill="#eef3fc" stroke="#14151a" stroke-width="2"/>
<rect x="24" y="252" width="57" height="16" rx="8" fill="#f6c445"/>

<text x="24" y="308" font-family="Poppins, Arial, sans-serif" font-weight="600" font-size="13" fill="#14151a">Afrique</text>
<text x="296" y="308" text-anchor="end" font-family="'Space Grotesk', Arial, sans-serif" font-weight="700" font-size="13" fill="#14151a">9%</text>
<rect x="24" y="318" width="272" height="16" rx="8" fill="#eef3fc" stroke="#14151a" stroke-width="2"/>
<rect x="24" y="318" width="24" height="16" rx="8" fill="#8fb2ea"/>

<rect x="24" y="384" width="272" height="120" rx="18" fill="#fdfcf9" stroke="#14151a" stroke-width="2.5"/>
<text x="40" y="412" font-family="'Space Grotesk', Arial, sans-serif" font-weight="700" font-size="14" fill="#14151a">Classement amis</text>
<text x="40" y="438" font-family="Poppins, Arial, sans-serif" font-size="12" fill="#5b5c66">1. Lina — 31 pays</text>
<text x="40" y="460" font-family="Poppins, Arial, sans-serif" font-size="12" fill="#5b5c66">2. Toi — 24 pays</text>
<text x="40" y="482" font-family="Poppins, Arial, sans-serif" font-size="12" fill="#5b5c66">3. Sam — 19 pays</text>
</svg>
