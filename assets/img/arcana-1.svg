<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 640" role="img" aria-labelledby="t d">
<title id="t">Arcana — tirer une carte de tarot</title>
<desc id="d">Écran de tirage d'une carte de tarot Rider-Waite-Smith, ici La Papesse, avec un bouton pour mélanger le jeu.</desc>
<rect width="320" height="640" rx="34" fill="#fdfcf9"/>
<rect x="0" y="0" width="320" height="72" fill="#a488f2"/>
<text x="24" y="44" font-family="'Space Grotesk', Arial, sans-serif" font-weight="700" font-size="20" fill="#fdfcf9">&#10022; Arcana</text>
<text x="24" y="106" font-family="'Space Grotesk', Arial, sans-serif" font-weight="700" font-size="22" fill="#14151a">Tirez une carte</text>
<text x="24" y="130" font-family="Poppins, Arial, sans-serif" font-size="12" fill="#5b5c66">Derni&#232;re tirage &#8212; La Papesse</text>

<rect x="85" y="156" width="150" height="250" rx="10" fill="#fdfcf9" stroke="#14151a" stroke-width="3"/>
<rect x="93" y="164" width="134" height="234" rx="6" fill="none" stroke="#5a3bb5" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="160.0" y="186" text-anchor="middle" font-family="'Space Grotesk', Arial, sans-serif" font-weight="700" font-size="13" fill="#5a3bb5">II</text>
<text x="160.0" y="291.0" text-anchor="middle" font-size="80">&#127768;</text>
<text x="160.0" y="392" text-anchor="middle" font-family="'Space Grotesk', Arial, sans-serif" font-weight="700" font-size="12" fill="#14151a">La Papesse</text>

<rect x="24" y="440" width="272" height="52" rx="26" fill="#14151a"/>
<text x="160" y="472" text-anchor="middle" font-family="'Space Grotesk', Arial, sans-serif" font-weight="700" font-size="14" fill="#fdfcf9">&#10022; M&#233;langer le jeu</text>
<rect x="252" y="90" width="44" height="30" rx="15" fill="#fdfcf9" stroke="#14151a" stroke-width="2"/>
<text x="274" y="110" text-anchor="middle" font-size="14">&#8505;</text>
</svg>
