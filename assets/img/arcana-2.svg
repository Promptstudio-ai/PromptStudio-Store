<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 640" role="img" aria-labelledby="t d">
<title id="t">Arcana — signification d'une carte</title>
<desc id="d">Fiche détaillée d'une carte de tarot avec ses mots-clés à l'endroit et renversée, et son interprétation.</desc>
<rect width="320" height="640" rx="34" fill="#fdfcf9"/>
<rect x="0" y="0" width="320" height="72" fill="#a488f2"/>
<text x="24" y="44" font-family="'Space Grotesk', Arial, sans-serif" font-weight="700" font-size="18" fill="#fdfcf9">La Papesse</text>

<rect x="120" y="90" width="80" height="130" rx="10" fill="#fdfcf9" stroke="#14151a" stroke-width="3"/>
<rect x="128" y="98" width="64" height="114" rx="6" fill="none" stroke="#5a3bb5" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="160.0" y="120" text-anchor="middle" font-family="'Space Grotesk', Arial, sans-serif" font-weight="700" font-size="13" fill="#5a3bb5">II</text>
<text x="160.0" y="165.0" text-anchor="middle" font-size="42">&#127768;</text>
<text x="160.0" y="206" text-anchor="middle" font-family="'Space Grotesk', Arial, sans-serif" font-weight="700" font-size="12" fill="#14151a"></text>

<text x="160" y="244" text-anchor="middle" font-family="'Space Grotesk', Arial, sans-serif" font-weight="700" font-size="16" fill="#14151a">Intuition &#8226; Myst&#232;re &#8226; Savoir</text>
<rect x="24" y="266" width="120" height="34" rx="17" fill="#c9f0e9" stroke="#14151a" stroke-width="2"/>
<text x="84" y="288" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-weight="600" font-size="11" fill="#14151a">&#8593; Endroit</text>
<rect x="176" y="266" width="120" height="34" rx="17" fill="#f7c9e0" stroke="#14151a" stroke-width="2"/>
<text x="236" y="288" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-weight="600" font-size="11" fill="#14151a">&#8595; Renvers&#233;e</text>
<rect x="24" y="316" width="272" height="180" rx="18" fill="#fdfcf9" stroke="#14151a" stroke-width="2.5"/>
<text x="40" y="344" font-family="'Space Grotesk', Arial, sans-serif" font-weight="700" font-size="13" fill="#14151a">Interpr&#233;tation</text>
<text x="40" y="368" font-family="Poppins, Arial, sans-serif" font-size="11" fill="#5b5c66">La Papesse invite &#224; &#233;couter</text>
<text x="40" y="386" font-family="Poppins, Arial, sans-serif" font-size="11" fill="#5b5c66">votre intuition avant d'agir et &#224;</text>
<text x="40" y="404" font-family="Poppins, Arial, sans-serif" font-size="11" fill="#5b5c66">prendre le temps de la r&#233;flexion.</text>
</svg>
